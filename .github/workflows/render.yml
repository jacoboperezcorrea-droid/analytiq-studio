name: Render pieza

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID del trabajo en analytiq_content_jobs"
        required: true

concurrency:
  group: render-${{ inputs.job_id }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Renderizar y entregar
        env:
          STUDIO_SECRET: ${{ secrets.STUDIO_SECRET }}
        run: python -m studio.pipeline --job "${{ inputs.job_id }}"
